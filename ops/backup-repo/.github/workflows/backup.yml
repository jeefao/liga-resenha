# Backup semanal do banco da Liga Resenha V6 (toda terça, depois da etapa de segunda).
# Gera um arquivo .sql.gz com todas as tabelas e dados do schema public e guarda
# neste repositório PARTICULAR. Mantém os últimos 26 backups (cerca de 6 meses).
# Precisa do secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions).
name: Backup semanal

on:
  schedule:
    - cron: '23 6 * * 2' # terça às 06:23 UTC (03:23 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          erro() { echo "::error::$1"; exit 1; }
          [ -n "$DATABASE_URL" ] || erro "Falta o secret SUPABASE_DB_URL (Settings > Secrets and variables > Actions)."
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) erro "O secret SUPABASE_DB_URL deve começar com postgresql:// — copie de novo do Supabase (Connect > Session pooler)." ;;
          esac
          case "$DATABASE_URL" in *YOUR-PASSWORD*) erro "Troque [YOUR-PASSWORD] (com os colchetes) pela senha do banco no secret SUPABASE_DB_URL." ;; esac
          case "$DATABASE_URL" in *pooler.supabase.com*) ;; *) erro "Use o endereço do Session pooler (contém pooler.supabase.com), não o Direct connection." ;; esac
          mkdir -p backups
          arquivo="backups/liga-resenha-v6-$(date -u +%Y-%m-%d).sql"
          if ! /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
              --schema=public --no-owner --no-privileges --file="$arquivo" 2>erro.txt; then
            msg=$(tr '\n' ' ' < erro.txt | sed 's#postgresql://[^ ]*#[endereço oculto]#g')
            case "$msg" in
              *"password authentication failed"*) erro "Senha do banco incorreta no secret SUPABASE_DB_URL. ($msg)" ;;
              *"Tenant or user not found"*) erro "Usuário do endereço incorreto: use o endereço completo do Session pooler (postgres.frioxrtyffuotmmdmtxu). ($msg)" ;;
              *) erro "pg_dump falhou: $msg" ;;
            esac
          fi
          # Confere se o backup tem as tabelas principais antes de guardar
          grep -q "CREATE TABLE public.ligas " "$arquivo" || erro "Backup sem a tabela ligas — conferir."
          grep -q "CREATE TABLE public.ligas_versoes " "$arquivo" || erro "Backup sem a tabela ligas_versoes — conferir."
          echo "Tamanho: $(du -h "$arquivo" | cut -f1)"
          gzip -f "$arquivo"
          # Mantém só os 26 mais recentes
          ls -1 backups/*.sql.gz | sort | head -n -26 | xargs -r rm -f

      - name: Guardar no repositório
        run: |
          git config user.name "backup-liga-resenha"
          git config user.email "backup-liga-resenha@users.noreply.github.com"
          git add -A backups
          if git diff --cached --quiet; then
            echo "Nada novo para guardar."
          else
            git commit -q -m "Backup $(date -u +%Y-%m-%d)"
            git push
          fi
